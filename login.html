<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Wallet Tracker — Masuk / Daftar</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1d4ed8',
            'primary-light': '#3b82f6',
            success: '#22c55e',
            danger : '#ef4444',
          },
        },
      },
    };
  </script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <!-- ═══════════════════════════════════════════════════════════
       CENTER CARD
  ═══════════════════════════════════════════════════════════ -->
  <div class="w-full max-w-md">

    <!-- Brand header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-primary
                  rounded-2xl shadow-lg mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor"
             stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342
                   1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0
                   -.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0
                   .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504
                   1.125 1.125v9.75c0 .621-.504 1.125-1.125
                   1.125h-.375m1.5-1.5H21a.75.75 0
                   00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0
                   01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15
                   10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12
                   0h.008v.008H6V10.5z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Student Wallet Tracker</h1>
      <p class="text-sm text-slate-500 mt-1">Kelola keuangan mahasiswamu dengan mudah</p>
    </div>

    <!-- Tab switcher: Login / Register -->
    <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
      <button id="tab-login"
              onclick="switchTab('login')"
              class="flex-1 py-2 text-sm font-semibold rounded-lg
                     bg-white text-slate-800 shadow-sm transition-all">
        Masuk
      </button>
      <button id="tab-register"
              onclick="switchTab('register')"
              class="flex-1 py-2 text-sm font-semibold rounded-lg
                     text-slate-500 transition-all">
        Daftar
      </button>
    </div>

    <!-- ── LOGIN FORM ─────────────────────────────────────────── -->
    <div id="panel-login"
         class="bg-white rounded-2xl border border-slate-100 p-6 sm:p-8 shadow-sm">

      <form id="login-form" novalidate class="space-y-5">

        <div>
          <label for="l-username" class="block text-sm font-medium text-slate-600 mb-1.5">
            Username
          </label>
          <input id="l-username" type="text" autocomplete="username"
                 placeholder="Masukkan username..."
                 class="form-input w-full border border-slate-200 rounded-xl
                        px-3 py-2.5 text-sm bg-white" />
          <p id="l-err-username" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="l-password" class="block text-sm font-medium text-slate-600 mb-1.5">
            Password
          </label>
          <div class="relative">
            <input id="l-password" type="password" autocomplete="current-password"
                   placeholder="Masukkan password..."
                   class="form-input w-full border border-slate-200 rounded-xl
                          px-3 py-2.5 pr-10 text-sm bg-white" />
            <button type="button" onclick="togglePassword('l-password', this)"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400
                           hover:text-slate-600 transition-colors">
              <svg class="w-4 h-4" id="eye-icon-login" fill="none" stroke="currentColor"
                   stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5
                         12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431
                         0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638
                         0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>
          <p id="l-err-password" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <!-- Global error -->
        <div id="l-global-err"
             class="hidden bg-red-50 border border-red-200 text-red-700
                    text-sm rounded-xl px-4 py-3"></div>

        <button type="submit"
                class="btn-primary w-full bg-primary text-white font-semibold
                       text-sm py-3 rounded-xl flex items-center justify-center gap-2">
          <span id="login-btn-text">Masuk</span>
          <svg id="login-spinner" class="hidden w-4 h-4 animate-spin"
               fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                    stroke-width="4"/>
            <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        </button>

      </form>
    </div>

    <!-- ── REGISTER FORM ──────────────────────────────────────── -->
    <div id="panel-register"
         class="hidden bg-white rounded-2xl border border-slate-100 p-6 sm:p-8 shadow-sm">

      <form id="register-form" novalidate class="space-y-5">

        <div>
          <label for="r-username" class="block text-sm font-medium text-slate-600 mb-1.5">
            Username <span class="text-red-500">*</span>
          </label>
          <input id="r-username" type="text" autocomplete="username"
                 placeholder="Min. 3 karakter..."
                 class="form-input w-full border border-slate-200 rounded-xl
                        px-3 py-2.5 text-sm bg-white" />
          <p id="r-err-username" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="r-password" class="block text-sm font-medium text-slate-600 mb-1.5">
            Password <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input id="r-password" type="password" autocomplete="new-password"
                   placeholder="Min. 6 karakter..."
                   class="form-input w-full border border-slate-200 rounded-xl
                          px-3 py-2.5 pr-10 text-sm bg-white" />
            <button type="button" onclick="togglePassword('r-password', this)"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400
                           hover:text-slate-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor"
                   stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5
                         12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431
                         0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638
                         0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>
          <p id="r-err-password" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="r-password-confirm"
                 class="block text-sm font-medium text-slate-600 mb-1.5">
            Konfirmasi Password <span class="text-red-500">*</span>
          </label>
          <input id="r-password-confirm" type="password" autocomplete="new-password"
                 placeholder="Ulangi password..."
                 class="form-input w-full border border-slate-200 rounded-xl
                        px-3 py-2.5 text-sm bg-white" />
          <p id="r-err-confirm" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="r-budget" class="block text-sm font-medium text-slate-600 mb-1.5">
            Target Anggaran Bulanan (Rp)
            <span class="text-slate-400 font-normal">(opsional)</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400
                         text-sm font-medium pointer-events-none">Rp</span>
            <input id="r-budget" type="number" min="0"
                   placeholder="0 — bisa diatur nanti"
                   class="form-input w-full border border-slate-200 rounded-xl
                          pl-9 pr-3 py-2.5 text-sm bg-white" />
          </div>
          <p class="text-xs text-slate-400 mt-1">
            Digunakan untuk progress bar anggaran di dashboard.
          </p>
        </div>

        <!-- Global error -->
        <div id="r-global-err"
             class="hidden bg-red-50 border border-red-200 text-red-700
                    text-sm rounded-xl px-4 py-3"></div>

        <button type="submit"
                class="btn-primary w-full bg-primary text-white font-semibold
                       text-sm py-3 rounded-xl flex items-center justify-center gap-2">
          <span id="register-btn-text">Buat Akun</span>
          <svg id="register-spinner" class="hidden w-4 h-4 animate-spin"
               fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                    stroke-width="4"/>
            <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        </button>

      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      Student Wallet Tracker &copy; <span id="footer-year"></span>
    </p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TOAST
  ═══════════════════════════════════════════════════════════ -->
  <div id="toast"
       class="hide fixed bottom-6 right-6 bg-slate-800 text-white text-sm
              px-4 py-3 rounded-xl shadow-lg z-50 max-w-xs">
    <span id="toast-msg"></span>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       SCRIPTS
  ═══════════════════════════════════════════════════════════ -->
  <script type="module" src="js/login.js"></script>

  <script>
    /* ── Tab switcher ──────────────────────────────────────────── */
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('panel-login').classList.toggle('hidden',    !isLogin);
      document.getElementById('panel-register').classList.toggle('hidden',  isLogin);
      document.getElementById('tab-login').classList.toggle('bg-white',    isLogin);
      document.getElementById('tab-login').classList.toggle('shadow-sm',   isLogin);
      document.getElementById('tab-login').classList.toggle('text-slate-800', isLogin);
      document.getElementById('tab-login').classList.toggle('text-slate-500', !isLogin);
      document.getElementById('tab-register').classList.toggle('bg-white',    !isLogin);
      document.getElementById('tab-register').classList.toggle('shadow-sm',   !isLogin);
      document.getElementById('tab-register').classList.toggle('text-slate-800', !isLogin);
      document.getElementById('tab-register').classList.toggle('text-slate-500', isLogin);
    }

    /* ── Password visibility toggle ───────────────────────────── */
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      // Swap eye icon SVG path
      btn.querySelector('svg').innerHTML = isText
        ? `<path stroke-linecap="round" stroke-linejoin="round"
                 d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5
                    12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431
                    0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638
                    0-8.573-3.007-9.963-7.178z"/>
           <path stroke-linecap="round" stroke-linejoin="round"
                 d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round"
                 d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244
                    19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45
                    10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523
                    10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65
                    3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0
                    10-4.243-4.243m4.242 4.242L9.88 9.88"/>`;
    }

    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
